name: Capture legacy site audit
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/capture-legacy-audit.yml', 'scripts/capture-audit.mjs']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.49.1 --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node scripts/capture-audit.mjs 2>&1 | tail -60
      - name: Build archive
        if: always()
        run: |
          mkdir -p out/audit
          [ -d audit ] && cp -r audit/* out/audit/ 2>/dev/null || true
          [ -d public/media/legacy ] && cp -r public/media/legacy out/audit/images 2>/dev/null || true
          du -sh out/audit || true
          ls out/audit | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-audit
          path: out/audit
          retention-days: 7
